<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#0a0412;
    color:#f3e8ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    position:relative;
  }

  body::before{
    content:"";
    position:fixed;
    inset:-25%;
    background:
      radial-gradient(circle at 20% 30%, rgba(168,85,247,.42), transparent 45%),
      radial-gradient(circle at 80% 20%, rgba(217,70,239,.34), transparent 45%),
      radial-gradient(circle at 60% 80%, rgba(139,92,246,.38), transparent 50%),
      radial-gradient(circle at 15% 85%, rgba(192,132,252,.28), transparent 45%);
    filter:blur(50px);
    animation:drift 26s ease-in-out infinite alternate;
    z-index:-2;
    pointer-events:none;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    opacity:.07;
    mix-blend-mode:overlay;
    pointer-events:none;
    z-index:100;
    animation:grain .7s steps(2) infinite;
  }

  @keyframes drift{
    0%{transform:translate(0,0) scale(1) rotate(0deg)}
    50%{transform:translate(-3%,2%) scale(1.08) rotate(4deg)}
    100%{transform:translate(3%,-2%) scale(.96) rotate(-3deg)}
  }

  @keyframes grain{
    0%{transform:translate(0,0)}
    50%{transform:translate(-2%,1%)}
    100%{transform:translate(1%,-1%)}
  }

  @keyframes pulse{
    0%,100%{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 12px 34px rgba(88,28,135,.38),
        0 0 22px rgba(168,85,247,.10);
    }
    50%{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 14px 44px rgba(139,92,246,.55),
        0 0 34px rgba(217,70,239,.22);
    }
  }

  @keyframes flicker{
    0%,91%,100%{opacity:0}
    92%{opacity:1}
    93%{opacity:0}
    94%{opacity:.7}
    95%{opacity:0}
    96%{opacity:1}
    97%{opacity:0}
  }

  @keyframes glitch{
    0%{transform:translate(0,0)}
    25%{transform:translate(-1px,1px)}
    50%{transform:translate(1px,-1px)}
    75%{transform:translate(-1px,-1px)}
    100%{transform:translate(0,0)}
  }

  .view{
    position:fixed;
    inset:0;
    padding:24px;
    display:grid;
    gap:16px;
    grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(2,1fr);
    transition:padding .2s ease;
  }

  .view::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(168,85,247,.05);
    pointer-events:none;
    animation:flicker 9s steps(1) infinite;
    z-index:5;
  }

  .view.has-back{padding-top:96px}
  .view.editing{padding-bottom:104px}

  .view > .tile:nth-child(1),
  .view > .tile:nth-child(2),
  .view > .tile:nth-child(3){grid-column:span 2}
  .view > .tile:nth-child(4),
  .view > .tile:nth-child(5){grid-column:span 3}

  .view > .tile:nth-child(1){animation-delay:0s}
  .view > .tile:nth-child(2){animation-delay:-1.4s}
  .view > .tile:nth-child(3){animation-delay:-2.8s}
  .view > .tile:nth-child(4){animation-delay:-4.2s}
  .view > .tile:nth-child(5){animation-delay:-5.6s}

  .tile{
    position:relative;
    border-radius:22px;
    border:1px solid rgba(168,85,247,.30);
    background:linear-gradient(150deg, rgba(46,20,82,.92), rgba(18,6,38,.95));
    color:#f3e8ff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:20px;
    font-size:clamp(1.05rem, 1.9vw, 1.75rem);
    font-weight:650;
    letter-spacing:.3px;
    cursor:pointer;
    user-select:none;
    overflow:hidden;
    text-align:center;
    animation:pulse 5.5s ease-in-out infinite;
    transition:transform .18s ease, border-color .18s ease, background .2s ease;
  }

  .tile::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(217,70,239,.22), transparent 55%),
      radial-gradient(circle at 70% 80%, rgba(139,92,246,.18), transparent 55%);
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }

  .tile:hover::before{opacity:1}
  .tile:hover{
    transform:translateY(-3px);
    border-color:rgba(217,70,239,.65);
  }
  .tile:active{transform:translateY(-1px) scale(.995)}

  .tile .label{
    position:relative;
    z-index:1;
    word-break:break-word;
    line-height:1.2;
    text-shadow:
      0 0 12px rgba(217,70,239,.35),
      0 0 26px rgba(139,92,246,.25);
    transition:text-shadow .2s ease;
  }

  .tile:hover .label{
    text-shadow:
      0 0 10px rgba(232,121,249,.75),
      2px 0 0 rgba(217,70,239,.85),
      -2px 0 0 rgba(96,165,250,.75);
    animation:glitch .35s steps(2) infinite;
  }

  .tile.editing{
    cursor:default;
    flex-direction:column;
    justify-content:center;
    gap:12px;
    padding:16px;
    border-color:rgba(168,85,247,.45);
    background:linear-gradient(150deg, rgba(38,15,70,.96), rgba(14,5,32,.96));
    transform:none;
  }
  .tile.editing::before{display:none}
  .tile.editing:hover .label{animation:none}

  .name-input{
    width:100%;
    max-width:420px;
    text-align:center;
    background:rgba(168,85,247,.08);
    border:1px solid rgba(168,85,247,.35);
    border-radius:14px;
    color:#f3e8ff;
    font:inherit;
    font-size:clamp(1rem, 1.7vw, 1.5rem);
    padding:12px 14px;
    outline:none;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .name-input::placeholder{color:rgba(243,232,255,.35)}
  .name-input:focus{
    border-color:#d946ef;
    background:rgba(217,70,239,.12);
    box-shadow:0 0 0 3px rgba(217,70,239,.15), 0 0 20px rgba(217,70,239,.25);
  }

  .url-row{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    max-width:460px;
    background:rgba(168,85,247,.06);
    border:1px solid rgba(168,85,247,.28);
    border-radius:14px;
    padding:8px 12px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .url-row:focus-within{
    border-color:#d946ef;
    background:rgba(217,70,239,.10);
    box-shadow:0 0 0 3px rgba(217,70,239,.12), 0 0 18px rgba(217,70,239,.22);
  }

  .url-input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:#e9d5ff;
    font:inherit;
    font-size:.9rem;
    padding:6px 2px;
  }
  .url-input::placeholder{color:rgba(233,213,255,.35)}

  .favicon{
    width:24px;
    height:24px;
    flex:0 0 auto;
    border-radius:6px;
    object-fit:contain;
    background:rgba(168,85,247,.12);
    box-shadow:0 0 10px rgba(217,70,239,.25);
  }

  .back-btn{
    position:fixed;
    top:22px;
    left:24px;
    z-index:60;
    width:52px;
    height:52px;
    border-radius:16px;
    border:1px solid rgba(168,85,247,.35);
    background:rgba(24,8,48,.88);
    backdrop-filter:blur(12px);
    color:#f3e8ff;
    font-size:1.35rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 22px rgba(139,92,246,.28);
    transition:background .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .back-btn:hover{
    background:rgba(46,18,86,.95);
    border-color:rgba(217,70,239,.7);
    transform:translateY(-1px);
    box-shadow:0 0 30px rgba(217,70,239,.45);
  }

  .edit-btn{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:60;
    padding:14px 26px;
    border-radius:999px;
    border:1px solid rgba(217,70,239,.5);
    background:linear-gradient(140deg,#a855f7,#6d28d9);
    color:#fff;
    font:inherit;
    font-size:1rem;
    font-weight:650;
    letter-spacing:.4px;
    cursor:pointer;
    box-shadow:
      0 12px 30px rgba(139,92,246,.55),
      0 0 26px rgba(217,70,239,.35);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease, background .2s ease;
  }
  .edit-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
    box-shadow:
      0 16px 40px rgba(168,85,247,.7),
      0 0 40px rgba(217,70,239,.55);
  }
  .edit-btn.done{
    background:linear-gradient(140deg,#c084fc,#7c3aed);
    box-shadow:
      0 12px 30px rgba(192,132,252,.6),
      0 0 32px rgba(217,70,239,.45);
  }

  @media (max-width:780px){
    .view{
      grid-template-columns:1fr;
      grid-template-rows:none;
      grid-auto-rows:minmax(96px,1fr);
      overflow-y:auto;
      padding:16px;
      padding-bottom:100px;
      gap:12px;
    }
    .view.has-back{padding-top:88px}
    .view.editing{padding-bottom:100px}
    .view > .tile:nth-child(n){grid-column:span 1}
    .tile{font-size:1.1rem;border-radius:18px}
    .back-btn{top:16px;left:16px;width:46px;height:46px}
    .edit-btn{right:16px;bottom:16px;padding:13px 22px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const KEY = 'genrePortal.v1';
  const app = document.getElementById('app');

  let data;
  let currentGenre = null;
  let editMode = false;

  function defaultData(){
    const genres = [];
    for(let i = 0; i < 5; i++){
      const subs = [];
      for(let j = 0; j < 5; j++) subs.push({ name: 'Subgenre ' + (j + 1), url: '' });
      genres.push({ name: 'Genre ' + (i + 1), subs });
    }
    return { genres };
  }

  function normalize(raw){
    const genres = [];
    for(let i = 0; i < 5; i++){
      const g = (raw && raw.genres && raw.genres[i]) || {};
      const subs = [];
      for(let j = 0; j < 5; j++){
        const s = (g.subs && g.subs[j]) || {};
        subs.push({
          name: typeof s.name === 'string' ? s.name : 'Subgenre ' + (j + 1),
          url: typeof s.url === 'string' ? s.url : ''
        });
      }
      genres.push({
        name: typeof g.name === 'string' ? g.name : 'Genre ' + (i + 1),
        subs: subs
      });
    }
    return { genres: genres };
  }

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return defaultData();
      return normalize(JSON.parse(raw));
    }catch(e){
      return defaultData();
    }
  }

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
  }

  function normalizeUrl(u){
    let v = String(u || '').trim();
    if(!v) return '';
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function faviconUrl(u){
    const n = normalizeUrl(u);
    if(!n) return '';
    try{
      const host = new URL(n).hostname;
      if(!host) return '';
      return 'https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(host);
    }catch(e){
      return '';
    }
  }

  function makeFavicon(url){
    const img = document.createElement('img');
    img.className = 'favicon';
    img.alt = '';
    img.addEventListener('error', function(){ img.style.display = 'none'; });
    const src = faviconUrl(url);
    if(src){
      img.src = src;
    }else{
      img.style.display = 'none';
    }
    return img;
  }

  function genreTile(genre, index){
    const tile = document.createElement('div');
    tile.className = 'tile';

    if(editMode){
      tile.classList.add('editing');
      const input = document.createElement('input');
      input.className = 'name-input';
      input.type = 'text';
      input.value = genre.name;
      input.placeholder = 'Genre ' + (index + 1);
      input.maxLength = 60;
      input.spellcheck = false;
      input.addEventListener('input', function(){
        genre.name = input.value;
        save();
      });
      tile.appendChild(input);
    }else{
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = genre.name;
      tile.appendChild(label);
      tile.addEventListener('click', function(){
        currentGenre = index;
        editMode = false;
        render();
      });
    }

    return tile;
  }

  function subTile(sub, index){
    const tile = document.createElement('div');
    tile.className = 'tile';

    if(editMode){
      tile.classList.add('editing');

      const input = document.createElement('input');
      input.className = 'name-input';
      input.type = 'text';
      input.value = sub.name;
      input.placeholder = 'Subgenre ' + (index + 1);
      input.maxLength = 60;
      input.spellcheck = false;
      input.addEventListener('input', function(){
        sub.name = input.value;
        save();
      });

      const row = document.createElement('div');
      row.className = 'url-row';

      const icon = makeFavicon(sub.url);

      const urlInput = document.createElement('input');
      urlInput.className = 'url-input';
      urlInput.type = 'text';
      urlInput.value = sub.url;
      urlInput.placeholder = 'https://beispiel.de';
      urlInput.spellcheck = false;
      urlInput.addEventListener('input', function(){
        sub.url = urlInput.value;
        save();
        const src = faviconUrl(sub.url);
        if(src){
          icon.style.display = '';
          icon.src = src;
        }else{
          icon.removeAttribute('src');
          icon.style.display = 'none';
        }
      });

      row.appendChild(icon);
      row.appendChild(urlInput);
      tile.appendChild(input);
      tile.appendChild(row);
    }else{
      if(sub.url) tile.appendChild(makeFavicon(sub.url));

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = sub.name;
      tile.appendChild(label);

      tile.addEventListener('click', function(){
        const target = normalizeUrl(sub.url);
        if(!target) return;
        window.location.href = target;
      });
    }

    return tile;
  }

  function render(){
    app.innerHTML = '';

    const view = document.createElement('div');
    view.className = 'view';
    if(currentGenre !== null) view.classList.add('has-back');
    if(editMode) view.classList.add('editing');

    if(currentGenre === null){
      data.genres.forEach(function(genre, i){
        view.appendChild(genreTile(genre, i));
      });
    }else{
      data.genres[currentGenre].subs.forEach(function(sub, i){
        view.appendChild(subTile(sub, i));
      });
    }

    app.appendChild(view);

    if(currentGenre !== null){
      const back = document.createElement('button');
      back.className = 'back-btn';
      back.type = 'button';
      back.innerHTML = '&#8592;';
      back.title = 'Zurück';
      back.setAttribute('aria-label', 'Zurück');
      back.addEventListener('click', function(){
        currentGenre = null;
        editMode = false;
        render();
      });
      app.appendChild(back);
    }

    const edit = document.createElement('button');
    edit.className = 'edit-btn' + (editMode ? ' done' : '');
    edit.type = 'button';
    edit.textContent = editMode ? 'Fertig' : 'Edit';
    edit.addEventListener('click', function(){
      editMode = !editMode;
      render();
    });
    app.appendChild(edit);
  }

  data = load();
  render();
})();
</script>
</body>
</html>
