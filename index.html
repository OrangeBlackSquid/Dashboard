<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal</title>
<style>
  :root {
    --bg: #0d1014;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: rgba(255, 255, 255, 0.25);
    --text: #e8ebee;
    --text-dim: #5c6169;
    --accent: #e8ebee;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .view {
    position: fixed;
    inset: 0;
    padding: 24px;
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }

  .view.has-back { padding-top: 88px; }
  .view.editing { padding-bottom: 92px; }

  .tile {
    position: relative;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    font-size: clamp(0.95rem, 1.4vw, 1.25rem);
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
    text-align: center;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }

  .tile:hover {
    background: var(--surface-hover);
  }

  .tile:active {
    transform: scale(0.98);
  }

  .tile .label {
    word-break: break-word;
    line-height: 1.2;
    width: 100%;
  }

  .tile.editing {
    cursor: default;
    justify-content: center;
    padding: 12px;
    gap: 8px;
  }

  .tile.editing:hover {
    background: var(--surface);
  }

  .tile.editing:active {
    transform: none;
  }

  .name-input {
    width: 100%;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: clamp(0.85rem, 1.2vw, 1.1rem);
    padding: 10px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .name-input::placeholder { color: var(--text-dim); }
  .name-input:focus { border-color: var(--border-focus); }

  .url-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    transition: border-color 0.15s ease;
  }

  .url-row:focus-within { border-color: var(--border-focus); }

  .url-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: 0.75rem;
    padding: 6px 4px;
  }

  .url-input::placeholder { color: var(--text-dim); }

  .favicon {
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
    border-radius: 4px;
    object-fit: contain;
    background: rgba(255, 255, 255, 0.05);
  }

  .back-btn {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 60;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .back-btn:hover { background: var(--surface-hover); }
  .back-btn:active { transform: scale(0.95); }
  .back-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .edit-btn {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 60;
    padding: 14px 28px;
    border-radius: 100px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  .edit-btn:hover { opacity: 0.9; }
  .edit-btn:active { transform: scale(0.97); }

  .edit-btn.done {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
  }

  .edit-btn.done:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  @media (max-width: 1000px) {
    .tile { font-size: clamp(0.85rem, 1.6vw, 1.1rem); }
  }

  @media (max-width: 780px) {
    .view {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: none;
      grid-auto-rows: minmax(90px, auto);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      padding-top: 80px;
      padding-bottom: 96px;
      gap: 10px;
    }
    .tile { border-radius: 14px; padding: 12px; }
    .back-btn { top: 16px; left: 16px; width: 40px; height: 40px; }
    .edit-btn { right: 16px; bottom: 16px; padding: 12px 24px; font-size: 0.9rem; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'genrePortal.v1';
  const GRID_SIZE = 10;
  const MAX_NAME_LENGTH = 60;

  const app = document.getElementById('app');

  let data;
  let activeGenreIndex = null;
  let isEditing = false;

  function createDefaultData() {
    const genres = [];
    for (let i = 0; i < GRID_SIZE; i++) {
      const subs = [];
      for (let j = 0; j < GRID_SIZE; j++) {
        subs.push({ name: 'Subgenre ' + (j + 1), url: '' });
      }
      genres.push({ name: 'Genre ' + (i + 1), subs });
    }
    return { genres };
  }

  function normalizeData(raw) {
    const genres = [];
    for (let i = 0; i < GRID_SIZE; i++) {
      const g = raw?.genres?.[i] || {};
      const subs = [];
      for (let j = 0; j < GRID_SIZE; j++) {
        const s = g.subs?.[j] || {};
        subs.push({
          name: typeof s.name === 'string' ? s.name : 'Subgenre ' + (j + 1),
          url: typeof s.url === 'string' ? s.url : ''
        });
      }
      genres.push({
        name: typeof g.name === 'string' ? g.name : 'Genre ' + (i + 1),
        subs
      });
    }
    return { genres };
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultData();
      return normalizeData(JSON.parse(raw));
    } catch {
      return createDefaultData();
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch {}
  }

  function normalizeUrl(url) {
    let v = String(url || '').trim();
    if (!v) return '';
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function getFaviconUrl(url) {
    const normalized = normalizeUrl(url);
    if (!normalized) return '';
    try {
      const host = new URL(normalized).hostname;
      if (!host) return '';
      return 'https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(host);
    } catch {
      return '';
    }
  }

  function createFavicon(url) {
    const img = document.createElement('img');
    img.className = 'favicon';
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.addEventListener('error', () => { img.style.display = 'none'; }, { once: true });
    
    const src = getFaviconUrl(url);
    if (src) {
      img.src = src;
    } else {
      img.style.display = 'none';
    }
    return img;
  }

  function updateFavicon(img, url) {
    const src = getFaviconUrl(url);
    if (src) {
      img.style.display = '';
      img.src = src;
    } else {
      img.removeAttribute('src');
      img.style.display = 'none';
    }
  }

  function createElement(tag, className, text = '') {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text) el.textContent = text;
    return el;
  }

  function createTextInput(value, placeholder, onInput) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'name-input';
    input.value = value;
    input.placeholder = placeholder;
    input.maxLength = MAX_NAME_LENGTH;
    input.spellcheck = false;
    input.addEventListener('input', onInput);
    return input;
  }

  function buildGenreTile(genre, index) {
    const tile = createElement('div', 'tile');

    if (isEditing) {
      tile.classList.add('editing');
      const input = createTextInput(genre.name, 'Genre ' + (index + 1), (e) => {
        genre.name = e.target.value;
        saveData();
      });
      tile.appendChild(input);
    } else {
      const label = createElement('span', 'label', genre.name);
      tile.appendChild(label);
      tile.addEventListener('click', () => enterGenre(index));
    }

    return tile;
  }

  function buildSubTile(sub, index) {
    const tile = createElement('div', 'tile');

    if (isEditing) {
      tile.classList.add('editing');

      const nameInput = createTextInput(sub.name, 'Subgenre ' + (index + 1), (e) => {
        sub.name = e.target.value;
        saveData();
      });

      const urlRow = createElement('div', 'url-row');
      const icon = createFavicon(sub.url);
      
      const urlInput = document.createElement('input');
      urlInput.type = 'text';
      urlInput.className = 'url-input';
      urlInput.value = sub.url;
      urlInput.placeholder = 'https://...';
      urlInput.spellcheck = false;
      urlInput.addEventListener('input', (e) => {
        sub.url = e.target.value;
        saveData();
        updateFavicon(icon, sub.url);
      });

      urlRow.appendChild(icon);
      urlRow.appendChild(urlInput);
      tile.appendChild(nameInput);
      tile.appendChild(urlRow);
    } else {
      if (sub.url) {
        tile.appendChild(createFavicon(sub.url));
      }

      const label = createElement('span', 'label', sub.name);
      tile.appendChild(label);
      
      tile.addEventListener('click', () => {
        const target = normalizeUrl(sub.url);
        if (target) window.location.href = target;
      });
    }

    return tile;
  }

  function enterGenre(index) {
    activeGenreIndex = index;
    isEditing = false;
    render();
  }

  function exitGenre() {
    activeGenreIndex = null;
    isEditing = false;
    render();
  }

  function toggleEditing() {
    isEditing = !isEditing;
    render();
  }

  function render() {
    app.innerHTML = '';

    const view = createElement('div', 'view');
    if (activeGenreIndex !== null) view.classList.add('has-back');
    if (isEditing) view.classList.add('editing');

    if (activeGenreIndex === null) {
      data.genres.forEach((genre, i) => {
        view.appendChild(buildGenreTile(genre, i));
      });
    } else {
      data.genres[activeGenreIndex].subs.forEach((sub, i) => {
        view.appendChild(buildSubTile(sub, i));
      });
    }

    app.appendChild(view);

    if (activeGenreIndex !== null) {
      const backBtn = createElement('button', 'back-btn');
      backBtn.type = 'button';
      backBtn.title = 'Zurück';
      backBtn.setAttribute('aria-label', 'Zurück');
      backBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
      backBtn.addEventListener('click', exitGenre);
      app.appendChild(backBtn);
    }

    const editBtn = createElement(
      'button',
      'edit-btn' + (isEditing ? ' done' : ''),
      isEditing ? 'fertig' : 'bearbeiten'
    );
    editBtn.type = 'button';
    editBtn.addEventListener('click', toggleEditing);
    app.appendChild(editBtn);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && activeGenreIndex !== null) {
      exitGenre();
    }
  });

  data = loadData();
  render();
})();
</script>
</body>
</html>
